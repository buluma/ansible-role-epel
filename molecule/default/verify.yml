---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install a package from epel
      ansible.builtin.package:
        name: aalib
        state: present
      when:
        - (ansible_facts['distribution'] == "Amazon" and ansible_facts['distribution_major_version'] == "2") or (ansible_facts['os_family'] == "RedHat" and
          ansible_facts['distribution_major_version'] in [ "7", "8", "9", "10" ])
